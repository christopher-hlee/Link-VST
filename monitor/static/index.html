<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restock</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#100f0d; --surface:#141310; --surface-quiet:#131210; --surface-held:#131512;
  --rule:#26221d; --border:#221f1a; --rule-faint:#1c1915;
  --text:#d9d2c7; --bright:#f0e9dd; --text-dim:#a49c90;
  --muted:#6b6459; --dim:#544e45; --faint:#3d3831;
  --accent:#c2703f; --accent-hover:#d1804d; --accent-ink:#100f0d;
  --in-stock:#7fd1a4; --failing:#e0716b; --armed:#e0a458;
  --no-baseline:#7aa8d6; --held:#8a8177;
  --serif:'Fraunces',Georgia,serif;
  --sans:'Work Sans',system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--text);font-family:var(--sans);
  text-wrap:pretty;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
a{color:var(--accent)} a:hover{color:var(--accent-hover)}

/* No border radius and no shadows anywhere: square corners are the identity,
   depth comes from surface value shifts and 1px rules only. */
.eyebrow{font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted)}
.kicker{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--held)}
.state-eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:10px;
  font-weight:600;letter-spacing:.2em;text-transform:uppercase}
.mono{font-family:var(--mono)}

.hdr{padding:34px 44px 24px;display:flex;align-items:flex-end;
  justify-content:space-between;gap:40px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.hdr h1{font-family:var(--serif);font-size:32px;line-height:1;color:var(--bright);
  font-weight:400;margin:0}
.counts{display:flex;align-items:center;gap:26px;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);flex-wrap:wrap}

.btn-ghost{background:none;border:1px solid var(--rule);color:var(--text);font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;padding:12px 18px;transition:border-color .1s,color .1s}
.btn-ghost:hover{border-color:var(--accent);color:var(--bright)}
.btn-accent{background:var(--accent);border:none;color:var(--accent-ink);font-weight:600;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:14px 22px;transition:background .1s}
.btn-accent:hover{background:var(--accent-hover)}
.btn-accent:disabled{opacity:.5;cursor:not-allowed}
.btn-text{background:none;border:none;padding:0;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;transition:color .1s}
.btn-text:hover{color:var(--bright)}

.body{padding:0 44px 40px;display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:104px 1fr 300px;gap:28px;align-items:center;
  padding:24px 0;border-bottom:1px solid var(--border)}
.row.act{background:linear-gradient(90deg,rgba(127,209,164,.06),transparent 42%)}
.row.broken{background:linear-gradient(90deg,rgba(224,113,107,.07),transparent 42%)}
.shot{height:124px;background:repeating-linear-gradient(135deg,#191713 0 8px,#151310 8px 16px);
  display:flex;align-items:flex-end;padding:7px;background-size:cover;background-position:center}
.shot span{font-family:var(--mono);font-size:9px;color:var(--dim)}
.shot.sm{height:96px}
.name{font-family:var(--serif);font-size:30px;line-height:1;color:var(--bright);font-weight:400}
.name.sm{font-size:24px}
.meta{font-size:12px;color:var(--held)}
.meta b{color:var(--bright);font-weight:400}

.chips{display:flex;gap:8px}
.chip{flex:1;background:none;border:1px solid var(--dim);padding:15px 0;
  font-family:var(--serif);font-size:17px;color:var(--bright);min-height:48px;
  transition:border-color .1s,background .1s}
.chip:hover{border-color:var(--accent);background:#181410}
.chip.primary{flex:1.5;background:var(--accent);border:none;font-size:19px;color:var(--accent-ink)}
.chip.primary:hover{background:var(--accent-hover)}
.caption{font-size:11px;color:var(--dim);text-align:right}
.actions{display:flex;justify-content:flex-end;gap:18px;flex-wrap:wrap}

.group-label{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--dim);
  padding:26px 0 14px}
.wait{display:grid;grid-template-columns:1fr 130px 92px 96px auto;gap:16px;align-items:center;
  padding:12px 0;border-top:1px solid var(--rule-faint)}
.wait:last-child{border-bottom:1px solid var(--rule-faint)}
.wait .n{font-size:14px;color:var(--text-dim)}
.wait .n .k{color:var(--dim);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  padding-right:10px}
.wait .s{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:7px}
.wait .p{font-family:var(--serif);font-size:15px;color:var(--muted)}
.wait .t{font-size:12px;color:var(--faint);text-align:right}
.wait .wa{display:inline-flex;align-items:center;gap:10px;justify-self:end}

@keyframes armpulse{0%,100%{opacity:1}50%{opacity:.3}}
.pulse{animation:armpulse 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}

/* A fired drop is one compact row per item, each dismissable on its own.
   Cards were tried first and did not survive contact with reality: a store
   lists one product at a time, so every card held a single row and twenty
   drops filled the screen. */
.fired{display:grid;grid-template-columns:1fr 84px 74px 92px 34px;gap:14px;
  align-items:center;padding:12px 0;border-top:1px solid var(--rule-faint)}
.fired:last-child{border-bottom:1px solid var(--rule-faint)}
.fired .fi{font-family:var(--serif);font-size:16px;color:var(--bright);line-height:1.3;
  min-width:0;overflow-wrap:anywhere}
.fired .fi a{color:var(--bright);text-decoration:none}
.fired .fi a:hover{color:var(--accent)}
.fired .fi .k{display:block;font-family:var(--sans);font-size:10px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--dim);margin-bottom:3px}
.fired .fp{font-family:var(--serif);font-size:15px;color:var(--muted)}
.fired .ft{font-size:11px;color:var(--faint)}
/* Detection lag. Amber past five minutes, because that is the point at which
   the monitor stopped being the thing that told you first. */
.fired .lag{display:block;margin-top:2px;color:var(--held)}
.fired .lag.slow{color:var(--armed)}
.chip.mini{flex:none;width:100%;padding:8px 0;font-family:var(--sans);font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;min-height:34px}
/* The dismiss control. Dim until hovered so twenty of them do not read as
   twenty warnings, but always present rather than hidden behind a hover. */
.x{background:none;border:1px solid transparent;color:var(--dim);font-size:19px;
  line-height:1;width:34px;height:34px;transition:color .1s,border-color .1s}
.x:hover{color:var(--failing);border-color:var(--failing)}
.feed{display:grid;grid-template-columns:96px 150px 1fr 26px;gap:18px;align-items:baseline;
  padding:11px 0;border-top:1px solid var(--rule-faint)}
.feed .fw{font-size:12px;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.feed .fs{font-size:12px;color:var(--muted)}
.feed a{text-decoration:none}

.empty{color:var(--dim);font-size:13px;padding:40px 0;border-top:1px solid var(--border)}
.warn{background:#17140f;border-left:2px solid var(--armed);padding:12px 14px;
  font-size:12px;color:#c9bfae;margin:16px 0}
.warn b{color:var(--bright);font-weight:600}

.overlay{position:fixed;inset:0;background:rgba(11,10,9,.93);z-index:100;
  display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto}
.sheet{background:var(--ground);border:1px solid var(--rule);width:100%;max-width:780px;
  padding:34px 40px 32px}
.sheet h2{font-family:var(--serif);font-size:30px;font-weight:400;color:var(--bright);margin:0 0 6px}
.sheet .sub{font-size:14px;color:var(--held);max-width:600px;margin:0 0 20px;word-break:break-word}
.intent{display:grid;grid-template-columns:22px 1fr 240px;gap:16px;align-items:center;
  padding:20px 0;border:0;border-top:1px solid var(--border);background:none;
  width:100%;text-align:left;color:inherit}
.intent:hover{background:var(--surface-quiet)}
.intent[aria-pressed="true"]{background:#151310;border-left:2px solid var(--accent);
  padding:20px 16px 20px 14px}
.intent .q{font-family:var(--serif);font-size:20px;color:var(--bright)}
.intent .ex{font-size:12px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:8px;margin-top:22px}
.field label{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);
  display:flex;justify-content:space-between;gap:12px}
.field input{background:var(--surface);border:1px solid #2f2b25;color:var(--text);
  font-family:var(--mono);font-size:14px;padding:13px 14px;width:100%}
.field input:focus{outline:none;border-color:var(--accent)}
.detect{background:var(--surface-held);border:1px solid #2f3b34;padding:14px 16px;
  font-size:13px;color:var(--bright);margin-top:14px}
.detect .l2{font-size:12px;color:var(--held);margin-top:5px}
.detect.bad{border-color:#5c3230;color:var(--failing)}
.seg{display:flex;border:1px solid #2f2b25}
.seg button{flex:1;background:none;border:none;color:var(--muted);font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;padding:13px 0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.sheet-actions{display:flex;gap:18px;align-items:center;margin-top:28px;padding-top:24px;
  border-top:1px solid var(--border);flex-wrap:wrap}
.hide{display:none!important}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;
  background:var(--surface);border:1px solid var(--dim);padding:13px 20px;font-size:13px;max-width:90vw}
.toast.bad{border-color:var(--failing);color:#f3d9d7}
.toast.good{border-color:var(--in-stock);color:#d6f0e2}

@media (max-width:1100px){
  .row{grid-template-columns:80px 1fr 240px;gap:20px}
  .name{font-size:26px}
}
@media (max-width:820px){
  .hdr{padding:20px 16px 14px;gap:16px}
  .hdr h1{font-size:26px}
  .body{padding:0 16px 32px}
  .row{grid-template-columns:1fr;gap:14px;padding:20px 0}
  .shot{height:80px;max-width:120px}
  .name{font-size:24px}
  .actions{justify-content:flex-start}
  .caption{text-align:left}
  .wait{grid-template-columns:minmax(0,1fr) auto auto;gap:8px 10px}
  .wait .n{overflow-wrap:anywhere}
  .wait .p,.wait .t{display:none}
  .fired{grid-template-columns:1fr 84px 44px;gap:8px 10px}
  .fired .fp{display:none}
  .fired .ft{grid-column:1;font-size:10px}
  .feed{grid-template-columns:auto 1fr 44px;gap:4px 12px}
  /* Ellipsis on a 430px column leaves "www.ninte…", which names nothing.
     Wrapping costs a line and keeps the row readable. */
  .feed .fw{grid-column:1/-1;white-space:normal;overflow:visible}
  .feed .x{grid-row:1;grid-column:3}
  /* Long brand + title cannot shrink in an `auto` track, so the status span
     pushed the whole page sideways. */
  .wait .s{justify-self:end;text-align:right}
  .sheet{padding:24px 18px}
  .intent{grid-template-columns:22px 1fr;gap:12px}
  .intent .ex{display:none}
  .btn-text,.chip{min-height:44px}
  /* A destructive control needs a real tap target, and the inline style that
     sizes it on desktop has to be overridden explicitly to get one. */
  .x{width:44px!important;height:44px!important;font-size:22px!important}
}
</style>
</head>
<body>

<div id="login" class="overlay hide">
  <div class="sheet" style="max-width:420px">
    <h2>Restock</h2>
    <p class="sub" id="loginNote">Enter your dashboard password.</p>
    <div class="field" style="margin-top:0">
      <input type="password" id="pw" placeholder="Password" autocomplete="current-password">
    </div>
    <div class="sheet-actions">
      <button class="btn-accent" onclick="doLogin()">Sign in</button>
      <span id="loginErr" style="font-size:12px;color:var(--failing)"></span>
    </div>
  </div>
</div>

<main id="app" class="hide">
  <div class="hdr">
    <div style="display:flex;flex-direction:column;gap:8px">
      <span class="eyebrow" id="eyebrow">Your list</span>
      <h1 id="headline">—</h1>
    </div>
    <div class="counts" id="counts"></div>
  </div>
  <div class="body">
    <div id="warnings"></div>
    <div id="sheet" aria-live="polite"></div>
  </div>
</main>

<div id="add" class="overlay hide" onclick="if(event.target===this)closeSheet()"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let WATCHES = [], EVENTS = [], TIMER = null, INTENT = 'restock';

function toast(msg, kind = '') {
  const t = document.createElement('div');
  t.className = 'toast ' + kind; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 4500);
}

async function api(path, opts = {}) {
  const res = await fetch('/api' + path, {headers: {'Content-Type': 'application/json'}, ...opts});
  if (res.status === 401) { showLogin(); throw new Error('Not authenticated'); }
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.detail || ('HTTP ' + res.status));
  return body;
}

/* Every state pairs a SHAPE with a WORD, so colour is never load-bearing. */
const GLYPH = {
  in_stock:    '<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="4.5" fill="currentColor"/></svg>',
  held:        '<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="3.8" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>',
  out_of_stock:'<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="3.7" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>',
  failing:     '<svg width="11" height="11" viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="4.2" fill="none" stroke="currentColor" stroke-width="1.3"/><line x1="2.4" y1="7.6" x2="7.6" y2="2.4" stroke="currentColor" stroke-width="1.3"/></svg>',
  unknown:     '<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2.2 2.2"/></svg>',
  watching:    '<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="4.2" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="5" cy="5" r="1.4" fill="currentColor"/></svg>',
  armed:       '<svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><rect x="1.5" y="1.5" width="7" height="7" transform="rotate(45 5 5)" fill="currentColor"/></svg>',
  paused:      '<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect x="2" y="2" width="2.2" height="6" fill="currentColor"/><rect x="5.8" y="2" width="2.2" height="6" fill="currentColor"/></svg>',
};
const WORD = {in_stock: 'In stock', held: 'Held', out_of_stock: 'Sold out',
              failing: 'Failing', unknown: 'No baseline', watching: 'Watching', paused: 'Paused'};
const INK = {in_stock: 'var(--in-stock)', held: 'var(--held)', out_of_stock: 'var(--muted)',
             failing: 'var(--failing)', unknown: 'var(--no-baseline)',
             watching: 'var(--text)', paused: 'var(--dim)'};

/* Derived state. `armed` stays orthogonal and is never folded in — a watch can
   be failing and armed at once, and both must render. */
function derive(w) {
  if ((w.consecutive_failures || 0) > 0) return 'failing';
  if (w.paused) return 'paused';
  return w.last_state || 'unknown';
}
const isArmed = w => w.hot_until && new Date(w.hot_until.replace(' ', 'T') + 'Z') > new Date();
/* A rate-limited watch is healthy and deliberately polling less. It keeps its
   state, so without this it would look completely normal and the reason for the
   slower cadence would be invisible. */
const isBackingOff = w => (w.consecutive_failures || 0) === 0
  && /rate limited/i.test(w.last_error || '');
const backoffBadge = () =>
  `<span class="state-eyebrow" style="color:var(--armed);letter-spacing:.18em"` +
  ` title="The store asked for fewer requests. Polling has slowed; nothing is broken.">` +
  `${GLYPH.paused}Backing off</span>`;
/* Detection names a collection watch "host · handle" and separately sets
   brand=host, so rendering both prints the host twice. Show only the part the
   kicker does not already say. */
function shortName(w) {
  const name = w.last_title || w.name || '';
  const brand = (w.brand || '').trim();
  if (!brand || !name.toLowerCase().startsWith(brand.toLowerCase())) return name;
  return name.slice(brand.length).replace(/^\s*·\s*/, '') || name;
}
const realSizes = w => (w.available_sizes || []).filter(s => s && !/^default/i.test(s));

function ago(ts) {
  if (!ts) return 'never';
  const s = (Date.now() - new Date(ts.replace(' ', 'T') + 'Z')) / 1000;
  if (s < 60) return Math.max(0, Math.round(s)) + 's ago';
  if (s < 3600) return Math.round(s / 60) + 'm ago';
  if (s < 86400) return Math.round(s / 3600) + 'h ago';
  return Math.round(s / 86400) + 'd ago';
}
const every = w => {
  const n = (isArmed(w) ? w.hot_interval_s : w.base_interval_s) || 300;
  return n < 60 ? n + 's' : n < 3600 ? Math.round(n / 60) + 'm' : Math.round(n / 3600) + 'h';
};
const money = v => v == null ? '—' :
  '$' + (Number(v) % 1 === 0 ? Number(v).toLocaleString() : Number(v).toFixed(2));

const eyebrowFor = (state, extra) =>
  `<span class="state-eyebrow" style="color:${INK[state]}">${GLYPH[state] || ''}` +
  `${esc(WORD[state])}${extra ? ' · ' + esc(extra) : ''}</span>`;
const armedBadge = () =>
  `<span class="state-eyebrow" style="color:var(--armed);letter-spacing:.18em">` +
  `<span class="pulse" style="display:inline-flex">${GLYPH.armed}</span>Armed</span>`;
const shot = (w, cls, edge, caption) =>
  `<div class="shot ${cls}" style="border:1px solid ${edge};` +
  `${w.last_image ? "background-image:url('" + esc(w.last_image) + "')" : ''}">` +
  `${!w.last_image && caption ? '<span>shot</span>' : ''}</div>`;

/* ---------- rows ---------- */

function actRow(w) {
  const usable = (w.offers || []).filter(o => o.cart_url);
  /* Shopify names a product's only variant "Default Title". That is not a size,
     so a product with no named variants collapses to a single Add to cart —
     a chip reading "Default Title" would be nonsense. */
  const named = usable.filter(o => o.title && !/^default/i.test(o.title));
  const pref = named.filter(o => o.preferred);
  const rest = named.filter(o => !o.preferred);
  const sized = named.length > 0;

  let action;
  if (sized && usable.length) {
    /* Sold-out sizes are absent, never disabled — a disabled button invites a
       tap that cannot work. */
    const chips = [...pref, ...rest].slice(0, 6).map((o, i) => {
      const lead = i === 0 && pref.length > 0;
      return `<button class="chip${lead ? ' primary' : ''}"
        aria-label="Add size ${esc(o.title)} to cart"
        onclick="window.open('${esc(o.cart_url)}','_blank','noopener')">${esc(o.title)}${lead ? ' ⟶ cart' : ''}</button>`;
    }).join('');
    action = `<div class="chips">${chips}</div>
      <span class="caption">each chip is that size's cart link</span>`;
  } else {
    const cart = (usable[0] || {}).cart_url;
    action = `<button class="chip primary" style="flex:none;width:100%;padding:15px"
        onclick="window.open('${esc(cart || w.url)}','_blank','noopener')">
        ${cart ? 'Add to cart' : 'Open product'}</button>
      <span class="caption">${cart ? 'cart permalink · skips product page'
        : 'no cart link · opens the product page'}</span>`;
  }

  const watched = (w.size_pref || '').toUpperCase();
  const back = realSizes(w).join(', ');
  const bits = [money(w.last_price)];
  if (watched) bits.push('watching <b>' + esc(watched) + '</b>');
  if (back) bits.push(esc(back) + ' returned');
  bits.push('every ' + every(w) + (isArmed(w) ? ', armed' : ''));

  return `<div class="row act">
    ${shot(w, '', 'var(--in-stock)', true)}
    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
        ${eyebrowFor('in_stock', (watched ? 'your size · ' : '') + ago(w.last_checked_at))}
        ${isArmed(w) ? armedBadge() : ''}
        ${isBackingOff(w) ? backoffBadge() : ''}
      </div>
      <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap">
        <span class="name">${esc(w.last_title || w.name)}</span>
        <span class="kicker">${esc(w.brand || '')}</span>
      </div>
      <span class="meta">${bits.join(' · ')}</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:9px">
      ${action}
      <div class="actions" style="gap:14px">
        <button class="btn-text" style="color:var(--muted)" onclick="edit(${w.id})">Edit</button>
        <button class="btn-text" style="color:var(--muted)" onclick="detail(${w.id})">Details</button>
      </div>
    </div>
  </div>`;
}

/* Held is the app working. It must be visible and explained — never hidden,
   never styled as an error. */
function heldRow(w) {
  const back = realSizes(w).join(', ');
  const first = back ? back.split(',')[0].trim() : '';
  const watched = (w.size_pref || '').toUpperCase();
  return `<div class="row">
    ${shot(w, 'sm', '#2b3630')}
    <div style="display:flex;flex-direction:column;gap:7px">
      ${eyebrowFor('held', 'not your size · ' + ago(w.last_checked_at))}
      <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap">
        <span class="name sm" style="color:#c9c1b5">${esc(w.last_title || w.name)}</span>
        <span class="kicker" style="color:var(--muted)">${esc(w.brand || '')}</span>
      </div>
      <span class="meta">${money(w.last_price)} · in stock in
        <b>${esc(back || 'another size')}</b> only · you watch <b>${esc(watched)}</b>
        · nothing sent, and nothing wrong</span>
    </div>
    <div class="actions">
      ${first ? `<button class="btn-text" style="color:var(--accent)"
        onclick="alsoAlert(${w.id},'${esc(first)}')">Also alert on ${esc(first)}</button>` : ''}
      <button class="btn-text" style="color:var(--muted)" onclick="edit(${w.id})">Edit</button>
      <button class="btn-text" style="color:var(--muted)" onclick="detail(${w.id})">Details</button>
    </div>
  </div>`;
}

/* Failing must never inherit the calm sold-out treatment: hatched shot, red
   border, the error verbatim, and an explicit statement that the shown state
   is stale. */
function brokenRow(w) {
  const known = w.last_state && w.last_state !== 'unknown';
  const stale = known
    ? ` · the ${esc((WORD[w.last_state] || w.last_state)).toLowerCase()} reading you see is ` +
      esc(ago(w.last_checked_at).replace(' ago', '')) + ' old'
    : ' · this watch has never returned a reading';
  const n = w.consecutive_failures || 0;
  return `<div class="row broken">
    <div class="shot sm" style="border:1px solid #5c3230;
      background:repeating-linear-gradient(135deg,#231715 0 8px,#1b1412 8px 16px)"></div>
    <div style="display:flex;flex-direction:column;gap:7px">
      <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
        ${eyebrowFor('failing', 'stale state')}
        ${isArmed(w) ? armedBadge() : ''}
        ${w.paused ? eyebrowFor('paused', 'after ' + n + ' failures') : ''}
      </div>
      <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap">
        <span class="name sm">${esc(w.last_title || w.name)}</span>
        <span class="kicker" style="color:var(--muted)">${esc(w.brand || '')}</span>
      </div>
      <span class="meta"><span class="mono" style="color:var(--failing)">${esc(w.last_error || 'unknown error')}</span>
        · ${n} failure${n === 1 ? '' : 's'}${stale}</span>
    </div>
    <div class="actions">
      <button class="btn-text" style="color:var(--accent)" onclick="edit(${w.id})">Fix URL</button>
      <button class="btn-text" style="color:var(--muted)" onclick="checkNow(${w.id},this)">Check now</button>
      <button class="btn-text" style="color:var(--muted)"
        onclick="togglePause(${w.id},${w.paused ? 1 : 0})">${w.paused ? 'Resume' : 'Pause'}</button>
    </div>
  </div>`;
}

function waitRow(w) {
  const st = derive(w);
  const armed = isArmed(w);
  let tracked = '';
  if (w.kind === 'collection' && w.baseline_json) {
    try { tracked = ' · ' + JSON.parse(w.baseline_json).length + ' tracked'; } catch (e) {}
  }
  const status = isBackingOff(w)
    ? `<span class="s" style="color:var(--armed)" title="${esc(w.last_error)}">${GLYPH.paused}Backing off</span>`
    : armed
    ? `<span class="s" style="color:var(--armed)"><span class="pulse" style="display:inline-flex">${GLYPH.armed}</span>Armed${esc(tracked)}</span>`
    : `<span class="s" style="color:${INK[st]}">${['unknown', 'watching', 'paused'].includes(st) ? GLYPH[st] : ''}${esc(WORD[st])}${esc(tracked)}</span>`;
  const size = w.size_pref
    ? `<span style="color:var(--dim);font-size:12px"> · size ${esc(w.size_pref.toUpperCase())}</span>` : '';
  return `<div class="wait">
    <span class="n"><span class="k">${esc(w.brand || '')}</span>${esc(shortName(w))}${size}</span>
    ${status}
    <span class="p">${w.last_price != null ? money(w.last_price) : '—'}</span>
    <span class="t">${esc(ago(w.last_checked_at))} · ${esc(every(w))}</span>
    <span class="wa">
      <button class="btn-text" style="color:var(--dim)" onclick="edit(${w.id})">Edit</button>
      <button class="x" style="width:26px;height:26px;font-size:16px;vertical-align:middle"
        title="Delete this watch" aria-label="Delete ${esc(w.name)}"
        onclick="removeWatch(${w.id})">&times;</button>
    </span>
  </div>`;
}

/* ---------- drops ---------- */

const DROP_WINDOW_MS = 48 * 3600 * 1000;

/* Dismissal deletes the event, rather than flagging it in localStorage.
   This dashboard gets read on a phone and on a laptop, and an alert cleared on
   one has to be gone on the other — a per-browser flag quietly fails that. */
async function dismiss(id) {
  try { await api('/events/' + id, {method: 'DELETE'}); }
  catch (e) { toast(e.message, 'bad'); return; }
  EVENTS = EVENTS.filter(x => x.id !== id);
  render();
}

async function dismissAll(ids) {
  await Promise.all(ids.map(id => api('/events/' + id, {method: 'DELETE'}).catch(() => {})));
  EVENTS = EVENTS.filter(x => !ids.includes(x.id));
  render();
}

/* Clears EVERY event, including the ones listed above as actionable — so the
   count in the prompt has to be the total, not the length of the section the
   button happens to sit in. */
async function clearFeed() {
  if (!confirm(`Clear all ${EVENTS.length} alerts, including anything listed `
             + `above? The watches keep running.`)) return;
  try { await api('/events', {method: 'DELETE'}); }
  catch (e) { toast(e.message, 'bad'); return; }
  EVENTS = [];
  render();
  toast('Alert history cleared.', 'good');
}

const when = ts => new Date(String(ts).replace(' ', 'T') + 'Z');
const evName = e => e.watch_brand || e.watch_name || 'a watch';

/* Whether an event is news or merchandise is a property of the WATCH, not of
   the stored payload. Trusting the payload flag alone mislabels every event
   written before that flag existed — which is how articles ended up announcing
   themselves as "not in the 23-product catalogue". */
const isAnnounce = e =>
  e.watch_strategy === 'announce' || !!(e.payload || {}).is_announcement;

/* Events stored before per-item links existed still know their handle, and the
   handle is all a Shopify product URL needs — so old drops become clickable
   too rather than staying dead. */
function itemsOf(e) {
  const p = e.payload || {};
  let base = '';
  try { base = new URL(e.watch_url).origin; } catch (err) {}
  return (p.handles || []).map(h => {
    const it = (p.items || {})[h] || {};
    const url = it.url || (p.links || {})[h] ||
                (base && !isAnnounce(e) ? base + '/products/' + h : '');
    const carts = (it.offers || []).filter(o => o.cart_url);
    return {handle: h, title: it.title || (p.titles || {})[h] || h,
            price: it.price, url, cart: carts.length === 1 ? carts[0].cart_url : ''};
  });
}

/* A drop is one row, not a card.

   The card was built to hold several items at once — "3 new · Satisfy" — but a
   store lists one product at a time, so twenty drops became twenty full-height
   cards and the list turned into the clutter it was meant to surface. One row
   per item, each independently dismissable, says the same thing in a tenth of
   the space. */
/* How far behind the store we were when this fired. Shown only when the store
   gave us a publish time — an unknown lag has to read as unknown, never as
   zero, or the number stops being trustworthy exactly when it matters. */
function lagNote(e) {
  const s = (e.payload || {}).listed_ago_s;
  if (typeof s !== 'number') return '';
  const t = s < 90 ? s + 's' : s < 5400 ? Math.round(s / 60) + 'm'
                                        : Math.round(s / 3600) + 'h';
  const slow = s > 300;
  return `<span class="lag${slow ? ' slow' : ''}" title="Listed by the store `
       + `${t} before we detected it">· ${t} behind</span>`;
}

function dropRow(it, e, announce) {
  const act = it.cart
    ? `<button class="chip primary mini" onclick="window.open('${esc(it.cart)}','_blank','noopener')">Cart</button>`
    : it.url
    ? `<button class="chip mini" onclick="window.open('${esc(it.url)}','_blank','noopener')">${announce ? 'Read' : 'Open'}</button>`
    : '<span class="caption">no link</span>';
  return `<div class="fired">
    <span class="fi">
      <span class="k">${esc(evName(e))}</span>
      ${it.url ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>`
               : esc(it.title)}
    </span>
    <span class="fp">${it.price != null ? money(it.price) : ''}</span>
    <span class="ft">${esc(ago(e.created_at))}${lagNote(e)}</span>
    ${act}
    <button class="x" title="Dismiss" aria-label="Dismiss ${esc(it.title)}"
      onclick="dismiss(${e.id})">&times;</button>
  </div>`;
}

/* One line per alert ever sent, so the dashboard can be checked against
   Telegram instead of only agreeing with it by coincidence. */
const FEED_WORD = {
  restock: 'Back in stock', new_product: 'New listing', held_note: 'Held — not your size',
  price_drop: 'Price drop', watch_failing: 'Watch broke', watch_recovered: 'Watch recovered',
};
function feedRow(e) {
  const p = e.payload || {};
  let note = p.title || '';
  if (e.kind === 'new_product') note = (p.handles || []).map(h => (p.titles || {})[h] || h).join(', ');
  else if (e.kind === 'price_drop') note = `${money(p.old_price)} → ${money(p.new_price)}`;
  else if (e.kind === 'watch_failing') note = p.error || '';
  const items = itemsOf(e);
  const href = (items[0] || {}).url || p.product_url || e.watch_url || '';
  const label = FEED_WORD[e.kind] || e.kind;
  const ink = e.kind === 'watch_failing' ? 'var(--failing)'
            : e.kind === 'restock' ? 'var(--in-stock)' : 'var(--muted)';
  return `<div class="feed">
    <span class="t" style="text-align:left">${esc(ago(e.created_at))}</span>
    <span class="fs" style="color:${ink}">${esc(label)}</span>
    <span class="fw">${href ? `<a href="${esc(href)}" target="_blank" rel="noopener">` : ''}${esc(evName(e))}${note ? ' · ' + esc(note) : ''}${href ? '</a>' : ''}</span>
    <button class="x" style="width:26px;height:26px;font-size:16px"
      title="Delete this alert" aria-label="Delete alert" onclick="dismiss(${e.id})">&times;</button>
  </div>`;
}

/* ---------- the sheet ---------- */

function render() {
  const act = [], held = [], broken = [], waiting = [];
  for (const w of WATCHES) {
    const st = derive(w);
    if (st === 'failing') broken.push(w);
    else if (st === 'held') held.push(w);
    else if (st === 'in_stock') act.push(w);
    else waiting.push(w);
  }

  act.sort((a, b) => (b.last_checked_at || '').localeCompare(a.last_checked_at || ''));
  broken.sort((a, b) => (b.consecutive_failures || 0) - (a.consecutive_failures || 0));

  /* A drop has no lasting stock state — the collection just carries on
     watching — so without this what it found would be invisible. */
  const cutoff = Date.now() - DROP_WINDOW_MS;
  const fired = EVENTS.filter(e => e.kind === 'new_product'
    && when(e.created_at) >= cutoff && itemsOf(e).length);

  /* News and merchandise are not the same news. A feed match is something to
     read; a drop is something to buy, and letting articles inflate "things to
     act on" is how the number stops meaning anything. */
  const buy = [], news = [];
  for (const e of fired) {
    const a = isAnnounce(e);
    for (const it of itemsOf(e)) (a ? news : buy).push({it, e, a});
  }

  const n = act.length + buy.length;
  $('headline').textContent = !WATCHES.length ? 'Nothing watched yet'
    : n === 0 ? 'Nothing to act on' : n + ' thing' + (n === 1 ? '' : 's') + ' to act on';
  $('eyebrow').textContent = 'Your list · ' + new Date().toLocaleDateString(undefined,
    {weekday: 'long', day: 'numeric', month: 'long'});
  $('counts').innerHTML =
    `<span style="color:var(--in-stock)">${act.length} buyable</span>
     ${buy.length ? `<span style="color:var(--in-stock)">${buy.length} just dropped</span>` : ''}
     ${news.length ? `<span>${news.length} to read</span>` : ''}
     <span>${held.length} held</span>
     <span style="color:var(--failing)">${broken.length} broken</span>
     <button class="btn-ghost" onclick="openAdd()">Add a watch</button>`;

  const clearBtn = ids => `<button class="btn-text" style="color:var(--dim);margin-left:14px"
      onclick="dismissAll([${ids}])">Clear</button>`;

  let html = act.map(actRow).join('') + held.map(heldRow).join('') + broken.map(brokenRow).join('');

  if (buy.length) {
    const ids = [...new Set(buy.map(r => r.e.id))];
    html = `<div class="group-label">Just dropped · ${buy.length}${clearBtn(ids)}</div>
      <div>${buy.map(r => dropRow(r.it, r.e, false)).join('')}</div>` + html;
  }
  if (news.length) {
    const ids = [...new Set(news.map(r => r.e.id))];
    html += `<div class="group-label">From your feeds · ${news.length}${clearBtn(ids)}</div>
      <div>${news.map(r => dropRow(r.it, r.e, true)).join('')}</div>`;
  }
  if (waiting.length) {
    html += `<div class="group-label">Waiting · ${waiting.length} · nothing to do</div>
      <div>${waiting.map(waitRow).join('')}</div>`;
  }
  /* Anything already listed above as actionable is not repeated here. Showing
     each event twice is precisely the clutter this section was accused of. */
  const shown = new Set(fired.map(e => e.id));
  const history = EVENTS.filter(e => !shown.has(e.id));
  if (history.length) {
    html += `<div class="group-label">Recent alerts · ${history.length}
      <button class="btn-text" style="color:var(--dim);margin-left:14px"
        onclick="clearFeed()">Clear all</button></div>
      <div>${history.slice(0, 25).map(feedRow).join('')}</div>`;
  }
  if (!WATCHES.length) {
    html = `<div class="empty">Nothing watched yet. Add one — a product URL for a
      restock, a store URL for new drops, or a feed URL for something not announced.</div>`;
  }
  $('sheet').innerHTML = html;
}

/* ---------- actions ---------- */

async function refresh() {
  try {
    /* The alert feed is not optional decoration — it is the only place a fired
       drop lives, since the watch itself goes straight back to watching. */
    const [w, e] = await Promise.all([api('/watches'), api('/events?limit=50')]);
    WATCHES = w.watches;
    EVENTS = e.events || [];
    render();
  } catch (err) { /* 401 already handled */ }
}

async function alsoAlert(id, size) {
  const w = WATCHES.find(x => x.id === id);
  const next = [(w && w.size_pref) || '', size].filter(Boolean).join(', ');
  await api('/watches/' + id, {method: 'PATCH', body: JSON.stringify({size_pref: next})});
  toast('Now also alerting on ' + size + '.', 'good');
  refresh();
}
const togglePause = (id, paused) => api('/watches/' + id, {method: 'PATCH',
  body: JSON.stringify({enabled: !!paused})}).then(refresh);

async function checkNow(id, btn) {
  const label = btn.textContent;
  btn.textContent = 'Checking…'; btn.disabled = true;
  try {
    const r = await api('/watches/' + id + '/check', {method: 'POST'});
    const st = derive(r.watch);
    toast(st === 'failing' ? 'Still failing: ' + r.watch.last_error : 'Now: ' + WORD[st],
          st === 'failing' ? 'bad' : 'good');
    refresh();
  } catch (e) { toast(e.message, 'bad'); }
  finally { btn.textContent = label; btn.disabled = false; }
}

async function detail(id) {
  const d = await api('/watches/' + id);
  const w = d.watch, st = derive(w);
  $('add').innerHTML = `<div class="sheet">
    <h2>${esc(w.last_title || w.name)}</h2>
    <p class="sub"><a href="${esc(w.url)}" target="_blank" rel="noopener">${esc(w.url)}</a></p>
    <div style="font-size:13px;display:flex;flex-direction:column;gap:8px">
      <div>${eyebrowFor(st, 'every ' + every(w))}</div>
      ${w.size_pref ? `<div class="meta">Watching size <b>${esc(w.size_pref.toUpperCase())}</b></div>` : ''}
      ${w.last_error ? `<div class="mono" style="color:var(--failing)">${esc(w.last_error)}</div>` : ''}
    </div>
    <div class="group-label">Last ${d.checks.length} checks</div>
    <div style="max-height:300px;overflow-y:auto">
      ${d.checks.map(c => `<div class="wait" style="grid-template-columns:90px 46px 56px 1fr">
        <span class="t" style="text-align:left">${esc(ago(c.checked_at))}</span>
        <span class="s" style="color:${c.ok ? 'var(--in-stock)' : 'var(--failing)'}">${c.ok ? 'ok' : 'fail'}</span>
        <span class="s mono">${c.http_status == null ? '—' : c.http_status}</span>
        <span class="t mono" style="text-align:left">${esc((c.error || c.state || '').slice(0, 44))}</span>
      </div>`).join('') || '<div class="empty" style="padding:20px 0">No checks yet.</div>'}
    </div>
    <div class="sheet-actions"><button class="btn-ghost" onclick="closeSheet()">Close</button></div>
  </div>`;
  $('add').classList.remove('hide');
}

async function edit(id) {
  const w = (await api('/watches/' + id)).watch;
  const feedWatch = w.strategy === 'announce';
  const tier = w.base_interval_s <= 45 ? 'fast' : w.base_interval_s >= 900 ? 'slow' : 'base';

  $('add').innerHTML = `<div class="sheet">
    <h2>Edit watch</h2>
    <p class="sub">${esc(w.brand || '')} · ${esc(w.last_title || w.name)}</p>

    <div class="field" style="margin-top:0">
      <label>Name</label>
      <input type="text" id="eName" value="${esc(w.name)}">
    </div>

    <div class="field">
      <label>Url <span style="color:var(--dim)">${esc(w.strategy)} · ${esc(w.kind)}</span></label>
      <input type="url" id="eUrl" value="${esc(w.url)}">
    </div>

    ${feedWatch ? `<div class="field">
      <label>Keywords <span style="color:var(--dim)">a, b = either · a + b = both</span></label>
      <input type="text" id="eKw" value="${esc(w.target_ref || '')}">
      <div class="warn">On a busy feed, prefer <b>+</b>. One broad term matches
        nearly everything and the alerts become noise you learn to ignore.</div>
    </div>` : `<div class="field">
      <label>Size preference <span style="color:var(--dim)">blank = any size</span></label>
      <input type="text" id="eSize" value="${esc(w.size_pref || '')}" placeholder="m, l">
      <div class="warn">Naming a size silences every other size — the list will
        label it <b>held, not your size</b> rather than going quiet unexplained.</div>
    </div>`}

    <div class="field">
      <label>How often</label>
      <div class="seg" id="eSeg">
        <button aria-pressed="${tier === 'fast'}" data-tier="fast">45s</button>
        <button aria-pressed="${tier === 'base'}" data-tier="base">5m</button>
        <button aria-pressed="${tier === 'slow'}" data-tier="slow">15m</button>
      </div>
    </div>

    <div id="eWarn"></div>

    <div class="sheet-actions">
      <button class="btn-accent" id="eSave" onclick="saveEdit(${id})">Save changes</button>
      <button class="btn-text" style="color:var(--muted)" onclick="closeSheet()">Cancel</button>
      <button class="btn-text" style="color:var(--muted)"
        onclick="togglePause(${id},${w.paused ? 1 : 0}).then(closeSheet)">
        ${w.paused ? 'Resume watching' : 'Pause watching'}</button>
      <button class="btn-text" style="color:var(--failing);margin-left:auto"
        onclick="removeWatch(${id})">Delete</button>
      <span id="eErr" style="font-size:12px;color:var(--failing)"></span>
    </div>
  </div>`;
  $('add').classList.remove('hide');

  /* Say up front that a URL or keyword change starts over — otherwise the
     watch silently goes quiet for a cycle and looks broken. */
  const original = {url: w.url, kw: w.target_ref || ''};
  const flag = () => {
    const changed = $('eUrl').value.trim() !== original.url
      || (feedWatch && $('eKw').value.trim() !== original.kw);
    $('eWarn').innerHTML = changed
      ? `<div class="warn">This changes what the watch is looking at, so it
         starts over: the baseline is cleared and the next check re-reads from
         scratch. You won't be alerted about anything already there.</div>` : '';
  };
  $('eUrl').addEventListener('input', flag);
  if (feedWatch) $('eKw').addEventListener('input', flag);
  [...$('eSeg').children].forEach(b => b.onclick = () =>
    [...$('eSeg').children].forEach(x => x.setAttribute('aria-pressed', x === b)));
}

async function saveEdit(id) {
  const seg = [...$('eSeg').children].find(b => b.getAttribute('aria-pressed') === 'true');
  const body = {
    name: $('eName').value.trim(),
    url: $('eUrl').value.trim(),
    tier: seg ? seg.dataset.tier : 'base',
  };
  if ($('eKw')) body.target_ref = $('eKw').value.trim();
  if ($('eSize')) body.size_pref = $('eSize').value.trim() || null;

  $('eSave').disabled = true;
  try {
    const out = await api('/watches/' + id, {method: 'PATCH', body: JSON.stringify(body)});
    closeSheet();
    toast(out.rebaselined ? 'Saved. Baseline cleared — re-reading from scratch.'
                          : 'Saved.', 'good');
    refresh();
  } catch (e) { $('eErr').textContent = e.message; }
  finally { $('eSave').disabled = false; }
}

async function removeWatch(id) {
  const w = WATCHES.find(x => x.id === id);
  if (!confirm(`Delete "${(w && (w.last_title || w.name)) || id}"? Its history goes too.`)) return;
  await api('/watches/' + id, {method: 'DELETE'});
  closeSheet();
  toast('Deleted.', 'good');
  refresh();
}

/* ---------- add a watch: three intents, then only the fields that intent uses ---------- */

const INTENTS = [
  {id: 'restock', q: 'Tell me when one item is buyable again.',
   ex: 'The Cafelat Robot flipping from sold out to in stock — or a Satisfy short returning in your size.',
   ph: 'https://store.com/products/…'},
  {id: 'drop', q: 'Tell me when a brand releases anything new.',
   ex: 'Satisfy quietly adding a short to its store at 4am.',
   ph: 'https://store.com/collections/all'},
  {id: 'announcement', q: 'Tell me when something unannounced becomes real.',
   ex: 'The first mention of "zelda switch 2" on a news feed.',
   ph: 'https://site.com/news.xml'},
];

function openAdd() {
  INTENT = 'restock';
  $('add').innerHTML = `<div class="sheet">
    <h2>What do you want to be told about?</h2>
    <p class="sub">Three different questions. Pick the one you'd actually ask out loud.</p>
    <div id="intents">${INTENTS.map(i => `
      <button class="intent" aria-pressed="${i.id === INTENT}" onclick="pickIntent('${i.id}')">
        <span style="color:${i.id === INTENT ? 'var(--accent)' : 'var(--muted)'};display:inline-flex">
          ${i.id === INTENT ? GLYPH.in_stock : GLYPH.out_of_stock}</span>
        <span class="q">${esc(i.q)}</span>
        <span class="ex">${esc(i.ex)}</span>
      </button>`).join('')}</div>

    <div class="field">
      <label>Url <span style="color:var(--dim)">paste it, we'll identify it</span></label>
      <input type="url" id="aUrl" placeholder="${esc(INTENTS[0].ph)}">
    </div>
    <div id="detect"></div>

    <div id="kwField" class="field hide">
      <label>Keywords <span style="color:var(--dim)">a, b = either · a + b = both</span></label>
      <input type="text" id="aKw" placeholder="zelda + ocarina">
      <div class="warn">On a busy feed, prefer <b>+</b>. A single broad term like
        <b>switch 2</b> on a Switch&nbsp;2 news site matches nearly every article,
        and you'll get an alert an hour. <b>zelda + ocarina</b> fires only when
        both words appear.</div>
    </div>

    <div id="sizeField" class="field">
      <label>Size preference · optional <span style="color:var(--dim)">most wanted first</span></label>
      <input type="text" id="aSize" placeholder="m, l">
      <div class="warn">Naming a size silences every other size. If L comes back and M
        doesn't, this watch stays quiet on purpose — the list will label it
        <b>held, not your size</b>, so silence never looks like breakage.
        Leave blank to be alerted on any size.</div>
    </div>

    <div class="field">
      <label>How often</label>
      <div class="seg" id="seg">
        <button aria-pressed="false" data-tier="fast">45s</button>
        <button aria-pressed="true"  data-tier="base">5m</button>
        <button aria-pressed="false" data-tier="slow">15m</button>
      </div>
      <span style="font-size:11px;color:var(--dim)">Arm it later to drop to 45s when a drop is imminent.</span>
    </div>

    <div class="sheet-actions">
      <button class="btn-accent" id="saveBtn" onclick="saveWatch()">Start watching</button>
      <button class="btn-text" style="color:var(--muted)" onclick="closeSheet()">Cancel</button>
      <span id="addErr" style="font-size:12px;color:var(--failing)"></span>
    </div>
  </div>`;
  $('add').classList.remove('hide');
  $('aUrl').addEventListener('blur', detect);
  $('aUrl').addEventListener('input', () => { $('detect').innerHTML = ''; });
  $('aUrl').focus();
}
const closeSheet = () => $('add').classList.add('hide');

function pickIntent(id) {
  INTENT = id;
  document.querySelectorAll('#intents .intent').forEach((b, i) => {
    const on = INTENTS[i].id === id;
    b.setAttribute('aria-pressed', on);
    b.firstElementChild.style.color = on ? 'var(--accent)' : 'var(--muted)';
    b.firstElementChild.innerHTML = on ? GLYPH.in_stock : GLYPH.out_of_stock;
  });
  /* No field appears that the chosen intent doesn't use. */
  $('sizeField').classList.toggle('hide', id !== 'restock');
  $('kwField').classList.toggle('hide', id !== 'announcement');
  $('aUrl').placeholder = INTENTS.find(i => i.id === id).ph;
}

async function detect() {
  const url = $('aUrl').value.trim();
  if (!url) return;
  $('detect').innerHTML = '<div class="detect" style="color:var(--held);border-color:#2f2b25">Identifying…</div>';
  try {
    const d = await api('/detect', {method: 'POST', body: JSON.stringify({url})});
    const vs = d.variants || [];
    const named = vs.map(v => v.title).filter(t => t && !/^default/i.test(t));
    $('detect').innerHTML = `<div class="detect">
      <span style="color:var(--in-stock);display:inline-flex">${GLYPH.in_stock}</span>
      ${esc(d.strategy)} · <b>${esc(d.brand || '')}</b> · ${esc(d.name || '')}
      <div class="l2">${named.length > 1
        ? esc(named.length + ' size variants found — ' + named.join(', ')) + '. Cart permalink available per size.'
        : 'One variant. No size field needed — there is nothing to choose.'}</div></div>`;
    if (named.length <= 1) $('sizeField').classList.add('hide');
    else if (INTENT === 'restock') $('sizeField').classList.remove('hide');
  } catch (e) {
    $('detect').innerHTML = '<div class="detect bad">' + esc(e.message) + '</div>';
  }
}

async function saveWatch() {
  const url = $('aUrl').value.trim();
  $('addErr').textContent = '';
  if (!url) { $('addErr').textContent = 'Paste a URL first.'; return; }
  const seg = [...$('seg').children].find(b => b.getAttribute('aria-pressed') === 'true');
  const body = {url, tier: seg ? seg.dataset.tier : 'base', alert_level: 'info'};
  if (INTENT === 'restock' && !$('sizeField').classList.contains('hide')) {
    body.size_pref = $('aSize').value.trim() || null;
  }
  if (INTENT === 'announcement') {
    body.strategy = 'announce';
    body.kind = 'collection';
    body.target_ref = $('aKw').value.trim();
  }
  $('saveBtn').disabled = true;
  try {
    await api('/watches', {method: 'POST', body: JSON.stringify(body)});
    closeSheet();
    toast('Watching. First check runs within 15 seconds.', 'good');
    refresh();
  } catch (e) { $('addErr').textContent = e.message; }
  finally { $('saveBtn').disabled = false; }
}

/* ---------- auth ---------- */

function showLogin(note) {
  $('login').classList.remove('hide');
  $('app').classList.add('hide');
  if (note) $('loginNote').textContent = note;
  clearInterval(TIMER);
}

async function doLogin() {
  $('loginErr').textContent = '';
  try {
    await api('/login', {method: 'POST', body: JSON.stringify({password: $('pw').value})});
    $('pw').value = '';
    $('login').classList.add('hide');
    start();
  } catch (e) { $('loginErr').textContent = e.message; }
}

async function start() {
  const me = await api('/me');
  if (!me.auth_configured) {
    showLogin('Auth is not configured. Run `python -m monitor.hashpw` on the server.');
    return;
  }
  if (!me.authenticated) { showLogin(); return; }
  $('login').classList.add('hide');
  $('app').classList.remove('hide');
  $('warnings').innerHTML = me.telegram_configured ? '' :
    `<div class="warn">Telegram is not configured — alerts are recorded but not
     delivered. Run <span class="mono">./setup-telegram.sh</span> on the server.</div>`;
  await refresh();
  clearInterval(TIMER);
  TIMER = setInterval(refresh, 10000);
}

$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
start();
</script>
</body>
</html>
