[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crate-digger"
version = "0.1.0"
description = "A local-first sample crate-digging studio: search open audio archives, audition, chop, and drag loops into your DAW."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Christopher Lee" }]
keywords = ["sampling", "music", "dsp", "beatmaking", "archive", "crate digging"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "numpy>=1.24",
  "scipy>=1.10",
  "soundfile>=0.12",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
rip = ["yt-dlp>=2024.1.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
crate = "crate.cli:main"

[project.urls]
Homepage = "https://github.com/christopher-hlee/crate-digger"

[tool.setuptools.packages.find]
include = ["crate*"]

[tool.setuptools.package-data]
"crate.server" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:crate.*"]
asyncio_mode = "auto"
